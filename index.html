}

function resultView(){const rec=screen.recordId?db.attempts.find(x=>x.attemptId===screen.recordId):db.attempts.find(x=>x.attemptId===db.activeAttempt?.recordId);if(!rec)return homeView();const ex=exById(rec.exerciseId),pass=rec.wrong<=2;return `<div class="result"><button class="back" data-action="grade" data-id="${ex.grade}">← К упражнениям класса</button><section class="result-card ${pendingCelebrate&&db.settings.effectsEnabled&&pass&&rec.wrong>0?'celebrate':''}"><div class="eyebrow" style="justify-content:center">Результат этой попытки · ${ex.grade} класс</div><div class="result-stars" role="img" aria-label="${rec.stars} из 3 звёзд">${stars(rec.stars)}</div><span class="pill">${pass?'✓ Пройдено':'Ещё немного практики'}</span><h1>${rec.wrong===0?'Отлично! Всё верно.':pass?'Хорошая работа!':'Давай попробуем ещё'}</h1><p>${esc(ex.title)}</p><div class="result-stats"><div class="result-stat"><strong class="good">${rec.correct}/${rec.total}</strong><span>правильных ответов</span></div><div class="result-stat"><strong class="bad">${rec.wrong}</strong><span>${rec.wrong===1?'ошибка':'ошибок'}</span></div><div class="result-stat"><strong>${time(rec.elapsedMs)}</strong><span>активное время</span></div></div><div class="result-compare">${rec.improved?'✧ '+(rec.previousBest?'Новый лучший результат!':'Первый результат — начало положено!'):'Лучший результат сохранён: '+bestLabel(ex)}${rec.previousBest?`<br>Прежний лучший: ${rec.previousBest.correct}/${rec.previousBest.total} · ${time(rec.previousBest.elapsedMs)}`:''}</div><div class="result-buttons">${pass?btn(nextExercise(ex)?'К следующему упражнению →':'К итогам класса →',nextExercise(ex)?'prepare':'grade',nextExercise(ex)?.id||ex.grade):''}${btn('Повторить ещё ↻','repeat',ex.id,pass?'secondary':'')}</div><div class="result-links"><button data-action="grade" data-id="${ex.grade}">К упражнениям класса</button><button data-action="home">В меню классов</button></div></section>${rec.mistakes.length?`<section class="mistakes"><h2  case 'symbol':{const input=document.getElementById(lastInput)||document.querySelector('.answer-input');if(!input||input.disabled||db.activeAttempt?.submittedAnswers[db.activeAttempt.currentIndex])break;const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;input.setRangeText(id,start,end,'end');input.focus();input.dispatchEvent(new Event('input',{bubbles:true}));break;}

function createCloudBackup({snapshot,canUpload,onChange,request=fetch.bind(globalThis),sessionStore=null,receiptStore=null}){
 if(!sessionStore)try{sessionStore=globalThis.sessionStorage;}catch{}
 if(!receiptStore)try{receiptStore=globalThis.localStorage;}catch{}
 const SESSION='po-polochkam.cloud.session',RECEIPT='po-polochkam.cloud.receipt.';
 let session=null,version=null,blocked=null,dirty=false,busy=false,timer=null,epoch=0,lastSent='',authBusy=false;
 const state={user:null,status:'Локально · вход не требуется',savedAt:null,blocked:null,busy:false};
 const emit=()=>onChange({...state,blocked,busy:busy||authBusy});
 const read=(store,key)=>{try{return JSON.parse(store.getItem(key)||'null');}catch{return null;}};

 async function api(path,{method='GET',data,token=session?.token}={}){
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);
  try{
   const response=await request('/api/game-state'+path,{method,headers:{...(data?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})},...(data?{body:JSON.stringify(data)}:{}),signal:controller.signal});
   const value=await response.json();
   if(!response.ok){const error=new Error(value.error?.message||'Ошибка сервера');error.status=response.status;error.code=value.error?.code;throw error;}
   return value;
  }finally{clearTimeout(timeout);}
 }
 function failed(error){
  if(error.status===401){epoch++;session=null;state.user=null;write(sessionStore,SESSION,null);state.status='Сеанс завершён · войдите снова, локальный прогресс сохранён';}
  else if(error.status===413)state.status='Копия слишком большая · локальный прогресс сохранён';
  else state.status='Облако недоступно · продолжаем локально';
 }
 function schedule(delay=1500){clearTimeout(timer);if(session&&!blocked)timer=setTimeout(()=>flush(),delay);}
 async function metadata(myEpoch){
  let meta;
  try{meta=await api('/apps/po-polochkam/zones/default/state/meta');}
  catch(e){if(e.status!==404)throw e;meta={version:0,updatedAt:null};}
  if(myEpoch!==epoch)return false;
  const receipt=read(receiptStore,RECEIPT+session.user.id);
  if(meta.version>0&&receipt?.version!==meta.version){
   blocked=meta;state.status='В аккаунте уже есть копия · нужно подтверждение замены';return false;
  }
  version=meta.version;return true;
 }
 async function flush(){
  clearTimeout(timer);
  if(!session||busy||blocked||!dirty)return;
  if(!canUpload()){state.status='Копия не отправлена · проверьте локальное сохранение и активную вкладку';emit();return;}
  const myEpoch=epoch;busy=true;state.status='Сохраняем в облако…';emit();
  try{
   if(version===null&&!(await metadata(myEpoch)))return;
   if(myEpoch!==epoch)return;
   const data=snapshot(),serialized=JSON.stringify(data);
   if(serialized===lastSent){dirty=false;state.status='В облаке сохранено';return;}
   dirty=false;
   // PUT response contains the sent snapshot; only version/time are used, never data.
   const result=await api('/apps/po-polochkam/zones/default/state',{method:'PUT',data:{data,version}});
   if(myEpoch!==epoch)return;
   version=result.state.version;lastSent=serialized;state.savedAt=result.state.updatedAt;state.status='В облаке сохранено';
   write(receiptStore,RECEIPT+session.user.id,{version,savedAt:state.savedAt});
  }catch(e){
   if(myEpoch!==epoch)return;
   dirty=true;
   if(e.status===409){version=null;blocked={version:null,updatedAt:null};state.status='Облачная копия изменилась · проверьте перед заменой';}
   else failed(e);
  }finally{busy=false;emit();if(dirty&&session&&!blocked)schedule(30000);}
 }
 function queue(){if(!session)return;dirty=true;if(!blocked&&!busy){state.status='Есть изменения · ожидают отправки';emit();}schedule();}
 async function authenticate(mode,credentials){
  if(authBusy||busy)return;
  authBusy=true;emit();const myEpoch=++epoch;
  try{
   const result=await api('/auth/'+mode,{method:'POST',data:credentials,token:null});
   if(myEpoch!==epoch)return;
   session=result;version=null;blocked=null;lastSent='';state.user=result.user;state.savedAt=read(receiptStore,RECEIPT+result.user.id)?.savedAt||null;
   write(sessionStore,SESSION,result);dirty=true;state.status='Вход выполнен';
  }finally{authBusy=false;emit();}
  await flush();
 }
 function logout(){
  const token=session?.token;epoch++;session=null;version=null;blocked=null;dirty=false;lastSent='';state.user=null;state.savedAt=null;state.status='Локально · вход не требуется';clearTimeout(timer);write(sessionStore,SESSION,null);emit();
  if(token)api('/auth/logout',{method:'POST',token}).catch(()=>{});
 }
 async function inspectConflict(){
  if(!session||busy)return;busy=true;emit();const myEpoch=epoch;
  try{
   let meta;try{meta=await api('/apps/po-polochkam/zones/default/state/meta');}catch(e){if(e.status!==404)throw e;meta={version:0,updatedAt:null};}
   if(myEpoch!==epoch)return;
   blocked=meta;state.status='Подтвердите замену облачной копии текущим прогрессом';
  }catch(e){if(myEpoch===epoch)failed(e);}finally{busy=false;emit();}
 }
 async function replace(){if(!blocked||blocked.version===null||busy||!session)return;version=blocked.version;blocked=null;lastSent='';dirty=true;await flush();}
 async function restore(){
  const stored=read(sessionStore,SESSION);if(!stored?.token||!stored?.user?.id){emit();return;}
  session=stored;const myEpoch=epoch;busy=true;emit();
  try{
   const {user}=await api('/me');if(myEpoch!==epoch)return;
   session.user=user;state.user=user;state.savedAt=read(receiptStore,RECEIPT+user.id)?.savedAt||null;dirty=true;
  }catch(e){if(myEpoch===epoch)failed(e);}finally{busy=false;emit();}
  if(session&&myEpoch===epoch){if(!state.user){state.user=stored.user;dirty=true;emit();schedule(30000);}else await flush();}
 }
 return {state,queue,flush,authenticate,logout,inspectConflict,replace,restore};
}

function cloudSnapshot(){saveDraft();accrue();return JSON.parse(JSON.stringify({...db,activeAttempt:db.activeAttempt?{...db.activeAttempt,paused:true}:null}));}
function cloudCanUpload(){return !readOnly&&!corruptRaw&&canWrite();}
let cloudView={user:null,status:'Локально · вход не требуется',savedAt:null,blocked:null,busy:false};
function cloudStatusText(){return cloudView.status+(cloudView.savedAt?' · '+new Date(cloudView.savedAt).toLocaleString('ru-RU'): '');}
function updateCloudView(value){
 cloudView=value;$('#cloud-status').textContent=cloudStatusText();
 $('#cloud-open').textContent=value.user?'☁ '+value.user.login:'☁ Сохранить в облако';
 const status=$('#cloud-dialog-status');if(status)status.textContent=cloudStatusText();
 // Do not rebuild login forms while typing. The account panel can update in place.
 if($('#cloud-dialog').open&&$('#cloud-account'))renderCloudDialog();
}
function renderCloudDialog(){
 const user=cloudView.user;
 $('#cloud-content').innerHTML=`<h2 id="cloud-title">Сохранение в облаке</h2><p class="cloud-hint">Можно играть без входа и без интернета. Игра использует локальный прогресс и сохраняет его резервную копию. Загрузка из облака пока отключена.</p><p id="cloud-dialog-status" role="status">${esc(cloudStatusText())}</p>`+(user?
 `<div id="cloud-account"><p>Аккаунт: <strong>${esc(user.login)}</strong></p>${cloudView.blocked?`<p>В аккаунте есть сохранение. Оно не загружалось в игру. Замена запишет вместо него <strong>прогресс этого устройства</strong>.</p>${cloudView.blocked.updatedAt?`<p>Облачная копия от ${esc(new Date(cloudView.blocked.updatedAt).toLocaleString('ru-RU'))}.</p>`:''}<button class="button danger" data-cloud-action="ask-replace"${cloudView.busy?' disabled':''}>Заменить облачную копию…</button>`:`<button class="button" data-cloud-action="save"${cloudView.busy?' disabled':''}>Сохранить сейчас</button>`}<button class="button secondary" data-cloud-action="logout">Отключить облако</button></div>`:
 `<form id="cloud-auth"><label>Логин<input name="login" autocomplete="username" required minlength="3" maxlength="64" pattern="[a-zA-Z0-9_.-]{3,64}" autocapitalize="none" spellcheck="false"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required minlength="4" maxlength="128"></label><p class="cloud-hint">При регистрации: логин из латинских букв, цифр, точки, дефиса или подчёркивания.</p><div class="cloud-actions"><button class="button" type="submit" name="mode" value="login">Войти</button><button class="button secondary" type="submit" name="mode" value="register">Зарегистрироваться</button></div></form>`)+`<p id="cloud-error" role="alert"></p><div class="dialog-actions"><button class="button secondary" data-cloud-action="close">Продолжить играть</button></div>`;
}
function openCloudDialog(){pause(false);if(screen.name==='exercise')render();renderCloudDialog();$('#cloud-dialog').showModal();}
cloudBackup=createCloudBackup({snapshot:cloudSnapshot,canUpload:cloudCanUpload,onChange:updateCloudView});
$('#cloud-open').addEventListener('click',openCloudDialog);
$('#cloud-dialog').addEventListener('submit',async e=>{
 if(e.target.id!=='cloud-auth')return;e.preventDefault();
 const form=e.target,mode=e.submitter?.value||'login',credentials={login:form.elements.login.value,password:form.elements.password.value};
 const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);$('#cloud-error').textContent='';
 try{await cloudBackup.authenticate(mode,credentials);if(cloudView.user){form.elements.password.value='';renderCloudDialog();}}
 catch(error){const messages={LOGIN_EXISTS:'Этот логин уже занят. Войдите или выберите другой.',INVALID_CREDENTIALS:'Неверный логин или пароль.',RATE_LIMIT:'Слишком много попыток. Попробуйте позже.',VALIDATION_ERROR:'Проверьте логин и пароль.'};const node=$('#cloud-error');if(node)node.textContent=messages[error.code]||'Облако недоступно. Можно продолжать играть без входа.';}
 finally{buttons.forEach(b=>b.disabled=false);}
});
$('#cloud-dialog').addEventListener('click',async e=>{
 const button=e.target.closest('[data-cloud-action]');if(!button||button.disabled)return;
 switch(button.dataset.cloudAction){
  case 'close':$('#cloud-dialog').close();break;
  case 'logout':cloudBackup.logout();renderCloudDialog();break;
  case 'save':cloudBackup.queue();await cloudBackup.flush();break;
  case 'ask-replace':
   await cloudBackup.inspectConflict();
   if(!cloudView.blocked||cloudView.blocked.version===null)break;
   $('#cloud-content').innerHTML=`<h2 id="cloud-title">Заменить облачную копию?</h2><p>Локальный прогресс останется на устройстве. Предыдущая облачная копия аккаунта ${esc(cloudView.user.login)} будет заменена текущим локальным прогрессом. Отменить замену нельзя.</p><div class="dialog-actions"><button class="button secondary" data-cloud-action="back">Отмена</button><button class="button danger" data-cloud-action="replace">Да, заменить копию</button></div>`;break;
  case 'back':renderCloudDialog();break;
  case 'replace':await cloudBackup.replace();renderCloudDialog();break;
 }
});
window.addEventListener('online',()=>{cloudBackup.queue();cloudBackup.flush();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cloudBackup.flush();});
cloudBackup.restore();
</script>
</body></html>
